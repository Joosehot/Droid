floaty = { weight = 1.0, axes = [-0.4, -0.5, 0.2] }
direct = { weight = 1.05, axes = [0.0, 0.3, 0.5] }
momentum = { weight = 0.95, axes = [0.4, 0.0, -0.4] }
slide = { weight = 1.0, axes = [0.0, 0.2, 0.4] }
