open = { weight = 1.0, axes = [-0.2, 0.5, 0.8] }
pillars = { weight = 1.05, axes = [0.3, 0.0, 0.0] }
rooms = { weight = 0.95, axes = [0.5, -0.4, -0.6] }
open_sky = { weight = 1.0, axes = [0.4, 0.2, 0.6] }
shields = { weight = 1.05, axes = [-0.4, -0.1, -0.2] }

[variants.controls]
