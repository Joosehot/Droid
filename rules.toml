# DroidGameEngine rules: every number the engine uses.
# The code holds the logic ("a chasing enemy must be slower than the player");
# this file holds the taste ("how much slower"). Change a value and the games change.
# Point `droid --rules my.toml` at a copy to experiment. Typos fail at load.

[search]
beam_width = 32         # partial solutions kept after each rule
per_shape = 4           # at most this many of them share a level shape (view, layout, controls, pickups, hazards)
finalists = 5           # complete candidates built and checked, best first
evidence_bonus = 8.0    # added when the sentence names a variant outright

# Profile axes, in this order everywhere: [challenge, pace, simplicity].
# A variant scores weight * (1 + axes . (profile - 0.5)).
[profile]
default = [0.5, 0.5, 0.5]

[profile.shift]
hard = [0.35, 0.0, 0.0]
easy = [-0.35, 0.0, 0.0]
fast = [0.0, 0.35, 0.0]
slow = [0.0, -0.35, 0.0]
simple = [0.0, 0.0, 0.4]

# How the profile turns into numbers.
[tuning]
pace_speed_gain = 0.6       # speeds x (1 + (pace - 0.5) * gain)
challenge_count_gain = 0.8  # enemy/hazard counts x (1 + (challenge - 0.5) * gain)
challenge_speed_gain = 0.4  # enemy speeds x (1 + (challenge - 0.5) * gain)
simplicity_count_cut = 0.5  # enemy/hazard counts x (1 - (simplicity - 0.5) * cut)
edit_speed_step = 1.25      # each "faster" / "slower"
edit_count_step = 1.5       # each "more" / "fewer"
edit_size_step = 1.3        # each "bigger" / "longer" / "smaller" / "shorter"
many_count = 16             # "lots of coins"
few_count = 3               # "a few bats"

# ---------------------------------------------------------------- variants
# weight and axes [challenge, pace, simplicity] for every choice a rule can make.

[variants.genre]
platformer = { weight = 1.0, axes = [0.0, 0.0, 0.0] }
arena = { weight = 0.95, axes = [0.0, 0.0, 0.0] }
shooter = { weight = 0.9, axes = [0.0, 0.0, 0.0] }

[variants.view]
flat = { weight = 1.0, axes = [0.0, 0.0, 0.2] }
depth = { weight = 0.1, axes = [0.0, 0.0, -0.4] }   # 3d mostly when asked for: the depth judges add up to +0.8

[variants.layout]
