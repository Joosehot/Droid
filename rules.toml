lowpoly = { weight = 1.0, axes = [0.0, 0.0, 0.0] }

# ---------------------------------------------------------------- judges
# Bonuses and penalties that look at several choices together.
[judges]
chase_needs_direct_control = -0.6     # chasing enemies + momentum controls feel unfair
rewarding_pickups_on_stacked = 0.5    # coins on high platforms need a layout that has them
trail_pickups_on_flat_run = 0.4
hazard_gaps_need_snappy = 0.3         # jumping spike gaps wants precise control
one_hit_with_shooting_enemies = -0.7  # bullets plus instant death is harsh
lives_with_waves = 0.3
open_arena_in_depth = 0.5             # walls block the 3D camera
lookahead_with_fast_controls = 0.3
calm_music_with_aggressive = -0.5
full_juice_in_depth = 0.3

# ---------------------------------------------------------------- physics and controls
[controls.snappy]
run = 7.5
accel = 16.0
jump = 14.5
gravity = 40.0
variable_jump = true

[controls.floaty]
run = 6.5
accel = 7.0
jump = 11.0
gravity = 22.0
variable_jump = false

[controls.direct]
speed = 7.0
accel = 0.0

[controls.momentum]
speed = 8.0
accel = 5.0

[controls.slide]
speed = 11.0
accel = 0.0

[controls.drift]
speed = 12.0
accel = 6.0

[abilities]
double_jump_factor = 0.85   # second jump speed / first
dash_speed = 22.0
dash_time = 0.15
dash_cooldown = 0.8
player_bullet_speed = 22.0
player_fire_cooldown = 0.28
invulnerable_time = 1.5

# ---------------------------------------------------------------- level layout
[layout.platformer]
length = 90.0            # world units at the default size
kill_y = -12.0
segment_min = 7.0        # ground piece length
segment_max = 14.0
gap_fraction = 0.55      # a gap is at most this fraction of the jump reach
rise_fraction = 0.7      # a step or platform is at most this fraction of the jump height
platform_width = [3.0, 6.0]
spawn_x = 3.0
exit_margin = 4.0
camera_zoom = 14.0
lookahead = 3.0          # the lookahead camera sees this many units more
camera_rise = 2.0        # the camera looks this far above the player (more sky, less underground)
ground_bottom = -6.0     # ground boxes reach down to here
first_segment = 11.0     # the spawn segment is at least this long
gap_min = 1.6
step_min = 0.6           # "steps" layout: smallest height change between segments
max_height = 5.0         # ground never climbs above this
platform_thickness = 0.5
platform_gap = 1.0       # clear space between a platform and anything under it
pit_depth = 1.4          # hazard pits ("in_gaps") are this deep
hazard_margin = 2.0      # hazards keep this far from a segment's ends
coin_height = 1.0        # pickups float this high above what they sit on
coin_spacing = 1.4
decor_every = 7.0        # one tree/bush per this many units of ground
clouds = 9
cloud_height = [6.0, 10.0]

[layout.arena]
width = 28.0
height = 17.0
pillar_every = 5.0
pillar_size = 1.4
room_door = 4.0
wall_height_3d = 1.4
camera_zoom = 19.0
follow_zoom = 13.0         # a following camera shows this many units top to bottom
pillar_keep = 0.7          # chance that a grid spot gets a pillar
pillar_height_3d = 2.8
wall_thickness = 1.0
clear_cell = 0.5           # flood-fill grid cell for the reachability check
decor = 8                  # decor pieces outside the walls (3D) or on the floor (2D)
depth_camera = [0.0, 14.0, 11.0]   # 3D follow offset (x, up, back)
high_camera = [0.0, 22.0, 7.0]

[layout.shooter]
