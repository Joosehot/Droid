# Droid asset library: real CC0 art downloaded from the internet (see packs.toml, CREDITS.md).
#
# Adding an asset = adding its files under packs/<pack>/ (and to that pack's `files` in
# packs.toml) plus an entry here. No code changes.
#
# [[sprite]]   2D art. `frames` are images relative to packs/<pack>/: { file = "x.png" },
#              { sheet = "sheet.png", tile = [col, row] } (with `tile_size`, optional `spacing`
#              and `margin` on the sprite), or { stack = [top, bottom] } for tall things.
#              `fps` animates the frames; `tint = true` means colour words may multiply it.
# [[tileset]]  tiles that draw ground, platforms and walls for a `theme` (forest, cave, snow,
#              desert, castle, ...). Every slot is one image like a frame.
# [[model]]    3D art: a glTF/GLB (or OBJ) file; `groups` maps node names to the animation
#              groups body/head/arm_l/arm_r/leg_l/leg_r/tail (no groups = guessed from names).
#
# `kinds` are lexicon words the asset can depict. `style` groups assets that look alike.

