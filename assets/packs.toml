# Every downloaded pack the asset library uses. assets/fetch.sh reads this file: it
# downloads `url`, checks `sha256`, and unpacks only `files` into packs/<id>/ (zip packs)
# or saves the download as files[0] (single-file packs), and writes packs/<id>/LICENSE.txt
# from `licence_file` inside the zip (or from `licence` + `page` when there is none).
# Keep one key per line and one file per line: fetch.sh parses it line by line.

