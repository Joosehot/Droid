[package]
name = "aige"
version = "0.1.0"
edition = "2021"
description = "AIGE - AI-native game engine. The AI writes the game; the engine runs it."

[[bin]]
name = "aige"
path = "src/main.rs"

[dependencies]
wgpu = "24"
winit = "0.30"
glam = "0.29"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
hecs = "0.10"
rhai = { version = "1", features = ["f32_float", "only_i64"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
log = "0.4"
env_logger = "0.11"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
