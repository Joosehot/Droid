[package]
name = "droid"
version = "0.1.0"
edition = "2021"
description = "Droid - a game engine whose games are written from a sentence (HotMotor design)"

[lib]
name = "droid"
path = "src/lib.rs"

[[bin]]
name = "droid"
path = "src/main.rs"

[workspace]
members = ["games/*"]

[dependencies]
wgpu = "24"
winit = "0.30"
glam = "0.29"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
hecs = "0.10"
rhai = { version = "1", features = ["f32_float", "only_i64"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = { version = "0.8", features = ["preserve_order"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
log = "0.4"
env_logger = "0.11"
rodio = { version = "0.19", default-features = false }
cpal = "0.15.3"           # microphone input (Ctx::voice); the version rodio already uses
image = { version = "0.25", default-features = false, features = ["png"] }
gltf = { version = "1", default-features = false, features = ["import", "utils", "names"] }
senne = { path = "../Senne" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
